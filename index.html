<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">

      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
    </noscript>
    
    <!-- Primary Meta Tags -->
    <title>The Desk | A 3D Portfolio</title>
    <meta name="title" content="The Desk | A 3D Portfolio" />
    <meta name="description" content="Step into The Desk, a portfolio built as a 3D room: projects, experience, an AI chat twin, a console game and a ginger kitten." />
    <link rel="canonical" href="https://okasp.dev/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="okasp.dev" />
    <meta property="og:url" content="https://okasp.dev/" />
    <meta property="og:title" content="The Desk | A 3D Portfolio" />
    <meta property="og:description" content="Step into The Desk, a portfolio built as a 3D room: projects, experience, an AI chat twin, a console game and a ginger kitten." />
    <meta property="og:image" content="https://okasp.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:image:alt" content="The Desk, a 3D portfolio as a neo-brutalist room: a cherry desk under a casement window, three swords and a clock on the wall, a game shelf with the Infinity Gauntlet, a cat tree and a ginger kitten on the rug" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://okasp.dev/" />
    <meta name="twitter:title" content="The Desk | A 3D Portfolio" />
    <meta name="twitter:description" content="Step into The Desk, a portfolio built as a 3D room: projects, experience, an AI chat twin, a console game and a ginger kitten." />
    <meta name="twitter:image" content="https://okasp.dev/og-image.jpg" />
    <meta name="twitter:image:alt" content="The Desk, a 3D portfolio room with a desk, a window, a game shelf and a ginger kitten" />

  </head>
  <body>
    <noscript>
      <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <!-- Loader for the desk (front page): painted with the HTML, before any JS, and kept outside
         #app so Vue's mount doesn't replace it. Once the room is drawn it asks the visitor in. -->
    <div id="boot-loader" role="status" aria-label="Loading the desk" hidden>
      <style>
        /* The desk's own terminal window booting in the dark. Once the room is ready behind it,
           this window moves onto the same window on the 3D monitor's desktop (which ends on the
           same lines; see workstation's standby) and the dark lifts off the room. Sizes are in
           the desktop's window units (--u: 1/368 of the window's width), as it is drawn there.
           Nothing animates on the main thread while loading (building the room holds it up). */
        #boot-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; transition: opacity .5s ease-out, visibility .5s; --bl-progress: .06; }
        #boot-loader[hidden] { display: none; }
        #boot-loader.is-done { opacity: 0; visibility: hidden; pointer-events: none; }
        #boot-loader.is-ready { cursor: pointer; }
        #boot-loader .bl-dark { position: absolute; inset: 0; background: radial-gradient(circle, #ffffff1a 1.4px, transparent 1.6px) 0 0 / 22px 22px #1a1714; transition: opacity .9s ease-in-out; }
        #boot-loader.is-ready .bl-dark { opacity: 0; }
        /* the hand-over: translate and scale onto the 3D window (set in bootLoader.js) */
        #boot-loader .bl-flip { position: relative; transition: transform .9s cubic-bezier(.65,0,.35,1), opacity .3s ease-in .85s; }
        #boot-loader.is-ready .bl-flip { opacity: 0; }
        #boot-loader .bl-win { position: relative; width: min(520px, calc(100vw - 40px)); aspect-ratio: 368 / 212; container-type: inline-size; }
        @media (min-width: 1100px) and (min-height: 800px) { #boot-loader .bl-win { width: 640px; } }
        #boot-loader .bl-frame { --u: calc(100cqw / 368); position: absolute; inset: 0; overflow: hidden; background: repeating-linear-gradient(0deg, #8fd6940f 0 calc(1.72 * var(--u)), transparent 0 calc(3.44 * var(--u))) 0 calc(20 * var(--u)) / 100% 100% no-repeat, #1a1714; border: calc(2 * var(--u)) solid #000; border-radius: calc(8 * var(--u)); box-shadow: calc(5 * var(--u)) calc(5 * var(--u)) 0 #000000d9; font: 700 calc(12.6 * var(--u)) / calc(18.9 * var(--u)) ui-monospace, Menlo, monospace; color: #8fd694; }
        #boot-loader .bl-title { display: flex; align-items: center; justify-content: center; position: relative; height: calc(18 * var(--u)); background: #ff7a1a; border-bottom: calc(2 * var(--u)) solid #000; color: #000; font: 700 calc(10 * var(--u)) / 1 "Space Grotesk", system-ui, sans-serif; }
        #boot-loader .bl-title i { position: absolute; top: calc(4.5 * var(--u)); width: calc(9 * var(--u)); height: calc(9 * var(--u)); border: calc(1.2 * var(--u)) solid #000; border-radius: 50%; box-sizing: border-box; background: #ff5f57; }
        #boot-loader .bl-title i:nth-child(1) { left: calc(5.5 * var(--u)); }
        #boot-loader .bl-title i:nth-child(2) { left: calc(19.5 * var(--u)); background: #febc2e; }
        #boot-loader .bl-title i:nth-child(3) { left: calc(33.5 * var(--u)); background: #28c840; }
        #boot-loader .bl-log { margin: 0; padding: calc(6.6 * var(--u)) 0 0 calc(11.75 * var(--u)); list-style: none; }
        #boot-loader .bl-log li { display: none; white-space: pre; }
        #boot-loader .bl-log li.is-on { display: block; }
        #boot-loader .bl-log .bl-cmd { color: #ff7a1a; }
        #boot-loader .bl-log li[data-at]:not(.bl-cmd)::after { content: "..."; animation: bl-blink 1s steps(1) infinite; will-change: opacity; }
        #boot-loader .bl-log li.is-ok:not(.bl-cmd)::after { content: "... ok"; animation: none; will-change: auto; }
        #boot-loader .bl-hl { display: inline-block; margin: calc(-2.3 * var(--u)) 0 0 calc(-4.6 * var(--u)); padding: 0 calc(5.7 * var(--u)); background: #ffdd00; color: #000; font-weight: 800; font-size: calc(13.75 * var(--u)); line-height: calc(17.8 * var(--u)); }
        #boot-loader .bl-cursor::after { content: ""; display: inline-block; width: calc(7.4 * var(--u)); height: calc(13.75 * var(--u)); margin-left: calc(2.3 * var(--u)); vertical-align: calc(-2 * var(--u)); background: #8fd694; animation: bl-blink 1.06s steps(1) infinite; }
        #boot-loader .bl-tap { display: none; }
        @media (hover: none) { #boot-loader .bl-press { display: none; } #boot-loader .bl-tap { display: inline; } }
        #boot-loader .bl-ready { display: none !important; }
        #boot-loader.is-ready .bl-ready { display: block !important; }
        #boot-loader.is-ready .bl-meter { display: none !important; }
        /* the enter button is for the keyboard and screen readers: the whole page takes the click */
        #boot-loader .bl-enter { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0; }
        #boot-loader .bl-pct { display: inline-block; position: relative; }
        #boot-loader .bl-pct::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: #8fd694; transform-origin: left; animation: bl-working 1.2s ease-in-out infinite alternate; will-change: transform; }
        @keyframes bl-working { from { transform: scaleX(.15); } to { transform: scaleX(1); } }
        @keyframes bl-blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { #boot-loader *, #boot-loader *::before, #boot-loader *::after { animation: none !important; transition: none !important; } }
      </style>
      <div class="bl-dark" aria-hidden="true"></div>
      <div class="bl-flip"><div class="bl-win">
        <div class="bl-frame">
          <div class="bl-title" aria-hidden="true"><i></i><i></i><i></i>the@desk: ~</div>
          <!-- each line comes on as the start reaches it (data-at, a fraction of the bar); the room's
               terminal ends on the same lines -->
          <ul class="bl-log" aria-hidden="true">
            <li class="bl-cmd is-on">&gt; boot the desk</li>
            <li class="is-on" data-at="0">loading the scene</li>
            <li data-at=".35">building the room</li>
            <li data-at=".6">drawing it · preparing shaders</li>
            <li data-at=".7">setting the light</li>
            <li class="bl-meter is-on">[<span class="bl-bar" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6">-----------------</span>] <span class="bl-pct"><span>6</span>%</span></li>
            <li class="bl-ready"><span class="bl-hl"><span class="bl-press">PRESS ENTER TO COME IN</span><span class="bl-tap">TAP TO COME IN</span></span></li>
            <li class="bl-ready bl-cmd bl-cursor">&gt;</li>
          </ul>
        </div>
      </div></div>
      <button type="button" class="bl-enter">Enter the desk</button>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        if (path === "/" || path === "/desk") document.getElementById("boot-loader").hidden = false;
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
