<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600&display=swap">
    </noscript>
    
    <!-- Primary Meta Tags -->
    <title>Oka Sutarto Putra | Full Stack Developer</title>
    <meta name="title" content="Oka Sutarto Putra | Full Stack Developer" />
    <meta name="description" content="Explore Oka Sutarto Putra's interactive 3D desk: projects, experience, an AI chat twin and plenty of clickable surprises. Full stack developer from Pontianak." />
    <link rel="canonical" href="https://okasp.dev/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="okasp.dev" />
    <meta property="og:url" content="https://okasp.dev/" />
    <meta property="og:title" content="Oka Sutarto Putra | Full Stack Developer" />
    <meta property="og:description" content="Explore Oka Sutarto Putra's interactive 3D desk: projects, experience, an AI chat twin and plenty of clickable surprises. Full stack developer from Pontianak." />
    <meta property="og:image" content="https://okasp.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Oka Sutarto Putra's neo-brutalist 3D desk: a monitor, an About board with an ID badge, a bookshelf with a katana and the Infinity Gauntlet" />

    <!-- X (Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://okasp.dev/" />
    <meta name="twitter:title" content="Oka Sutarto Putra | Full Stack Developer" />
    <meta name="twitter:description" content="Explore Oka Sutarto Putra's interactive 3D desk: projects, experience, an AI chat twin and plenty of clickable surprises. Full stack developer from Pontianak." />
    <meta name="twitter:image" content="https://okasp.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Oka Sutarto Putra's neo-brutalist 3D desk" />

  </head>
  <body>
    <noscript>
      <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <!-- Loader for the desk (front page): painted with the HTML, before any JS, and kept outside
         #app so Vue's mount doesn't replace it. The desk fades it out once its room is drawn. -->
    <div id="boot-loader" role="status" aria-label="Loading the desk" hidden>
      <style>
        #boot-loader { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle, #ffffff1f 1.4px, transparent 1.6px) 0 0 / 22px 22px #1a1714; transition: opacity .5s ease-out, visibility .5s; }
        #boot-loader[hidden] { display: none; }
        #boot-loader.is-done { opacity: 0; visibility: hidden; }
        #boot-loader .bl-card { width: min(300px, calc(100vw - 48px)); padding: 26px 24px 22px; background: #fffdf5; border: 4px solid #000; box-shadow: 9px 9px 0 #ff90e8; font-family: "Space Grotesk", system-ui, sans-serif; color: #000; animation: bl-in .5s cubic-bezier(.34,1.56,.64,1) both; }
        #boot-loader .bl-title { display: inline-block; padding: 6px 12px; background: #ffdd00; border: 4px solid #000; box-shadow: 5px 5px 0 #000; transform: rotate(-2deg); font: 800 22px/1 "Lexend Mega", "Montserrat", system-ui, sans-serif; letter-spacing: -1px; }
        #boot-loader .bl-props { display: flex; align-items: flex-end; gap: 10px; height: 64px; margin: 22px 0 16px; }
        #boot-loader .bl-props i { display: block; width: 30px; border: 3px solid #000; box-shadow: 3px 3px 0 #000; animation: bl-hop 1.2s cubic-bezier(.34,1.56,.64,1) infinite; }
        #boot-loader .bl-props i:nth-child(1) { height: 26px; background: #00e0c6; }
        #boot-loader .bl-props i:nth-child(2) { height: 40px; background: #ff6b6b; animation-delay: .12s; }
        #boot-loader .bl-props i:nth-child(3) { height: 30px; background: #7fb2ff; animation-delay: .24s; border-radius: 50% 50% 0 0; }
        #boot-loader .bl-props i:nth-child(4) { height: 46px; background: #ffdd00; animation-delay: .36s; }
        #boot-loader .bl-props i:nth-child(5) { height: 22px; background: #ff90e8; animation-delay: .48s; }
        #boot-loader .bl-bar { height: 16px; border: 3px solid #000; background: #fff; overflow: hidden; }
        #boot-loader .bl-bar span { display: block; height: 100%; width: 45%; background: repeating-linear-gradient(-45deg, #000 0 6px, #ffdd00 6px 12px); border-right: 3px solid #000; animation: bl-slide 1.1s ease-in-out infinite alternate; }
        #boot-loader .bl-text { margin: 12px 0 0; font: 700 12px/1.4 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .5px; text-transform: uppercase; }
        #boot-loader .bl-text b { display: inline-block; animation: bl-blink 1s steps(1) infinite; }
        @keyframes bl-in { from { opacity: 0; transform: translateY(16px) scale(.92); } }
        @keyframes bl-hop { 0%, 55%, 100% { transform: translateY(0); } 25% { transform: translateY(-16px) rotate(-6deg); } }
        @keyframes bl-slide { from { transform: translateX(-10%); } to { transform: translateX(132%); } }
        @keyframes bl-blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { #boot-loader *, #boot-loader .bl-card { animation: none !important; } }
      </style>
      <div class="bl-card">
        <div class="bl-title">THE DESK</div>
        <div class="bl-props" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="bl-bar" aria-hidden="true"><span></span></div>
        <p class="bl-text">Setting up the desk<b>_</b></p>
      </div>
    </div>
    <script>
      (function () {
        var path = location.pathname;
        if (path === "/" || path === "/desk") document.getElementById("boot-loader").hidden = false;
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
